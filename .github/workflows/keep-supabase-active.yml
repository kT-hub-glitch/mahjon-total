name: Keep Supabase Active

on:
  schedule:
    # 10:17 and 22:17 JST. Avoid the busiest start-of-hour window.
    - cron: "17 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query one participant
        env:
          SUPABASE_URL: https://irxsgvqazsqxsmpylhoy.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_nsg85bJVjJjWcZNmgF7y3Q_x7_3YZYU
        run: |
          curl --fail --silent --show-error \
            --max-time 20 \
            --retry 2 \
            --retry-all-errors \
            --output /dev/null \
            "$SUPABASE_URL/rest/v1/participants?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
