<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>麻雀大会集計ツール</title>
    <meta
      name="description"
      content="麻雀大会の選手、半荘結果、順位点、合計ポイントをブラウザだけで集計できます。"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Tournament Scoreboard</p>
        <h1>麻雀大会集計ツール</h1>
      </div>
      <div class="header-actions">
        <button id="sampleButton" class="ghost-button" type="button">サンプル</button>
        <button id="resetButton" class="danger-button" type="button">リセット</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="panel settings-panel" aria-labelledby="settingsHeading">
        <div class="section-title">
          <h2 id="settingsHeading">大会設定</h2>
          <span id="saveStatus" class="status-pill">保存済み</span>
        </div>

        <div class="form-grid">
          <label>
            大会名
            <input id="tournamentName" type="text" autocomplete="off" />
          </label>
          <label>
            返し
            <input id="returnScore" type="number" step="1000" min="0" />
          </label>
          <label>
            1位順位点
            <input id="uma1" type="number" step="1" />
          </label>
          <label>
            2位順位点
            <input id="uma2" type="number" step="1" />
          </label>
          <label>
            3位順位点
            <input id="uma3" type="number" step="1" />
          </label>
          <label>
            4位順位点
            <input id="uma4" type="number" step="1" />
          </label>
        </div>
      </section>

      <section class="panel" aria-labelledby="playersHeading">
        <div class="section-title">
          <h2 id="playersHeading">選手</h2>
          <span id="playerCount" class="count-label">0人</span>
        </div>
        <form id="playerForm" class="inline-form">
          <input id="playerName" type="text" placeholder="選手名を入力" autocomplete="off" />
          <button type="submit">追加</button>
        </form>
        <div id="playerList" class="chip-list" aria-live="polite"></div>
      </section>

      <section class="panel result-entry" aria-labelledby="entryHeading">
        <div class="section-title">
          <h2 id="entryHeading">半荘入力</h2>
          <span id="matchCount" class="count-label">0半荘</span>
        </div>
        <form id="matchForm" class="match-form">
          <div class="table-meta">
            <label>
              卓
              <input id="tableName" type="text" placeholder="A卓" autocomplete="off" />
            </label>
            <label>
              メモ
              <input id="matchMemo" type="text" placeholder="第1回戦など" autocomplete="off" />
            </label>
          </div>
          <div id="seatRows" class="seat-rows"></div>
          <button class="primary-button" type="submit">半荘を追加</button>
        </form>
      </section>

      <section class="panel standings-panel" aria-labelledby="standingsHeading">
        <div class="section-title">
          <h2 id="standingsHeading">総合集計</h2>
          <div class="export-actions">
            <button id="exportButton" class="ghost-button" type="button">CSV書き出し</button>
            <label class="file-button">
              CSV読込
              <input id="importInput" type="file" accept=".csv,text/csv" />
            </label>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>順位</th>
                <th>選手</th>
                <th>半荘</th>
                <th>合計</th>
                <th>平均</th>
                <th>トップ</th>
                <th>ラス</th>
                <th>素点合計</th>
              </tr>
            </thead>
            <tbody id="standingsBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel history-panel" aria-labelledby="historyHeading">
        <div class="section-title">
          <h2 id="historyHeading">半荘履歴</h2>
        </div>
        <div id="matchHistory" class="history-list"></div>
      </section>
    </main>

    <template id="seatTemplate">
      <div class="seat-row">
        <select class="seat-player" required></select>
        <input class="seat-score" type="number" step="100" placeholder="素点" required />
        <span class="seat-preview">0.0 pt</span>
      </div>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
