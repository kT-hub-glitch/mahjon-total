<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>麻雀大会集計ツール</title>
    <meta
      name="description"
      content="麻雀大会の選手、対局結果、順位点、合計ポイントをブラウザだけで集計できます。"
    />
    <link rel="stylesheet" href="./style.css?v=20260929-schedule-view" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>麻雀大会集計ツール</h1>
      </div>
    </header>

    <main class="app-shell">
      <section class="rule-strip" aria-label="Mリーグ固定ルール">
        <span>Mリーグルール</span>
        <strong>25,000点持ち</strong>
        <strong>返し 30000</strong>
        <strong>順位点 +50 / +10 / -10 / -30</strong>
        <strong>同点は順位点を分け</strong>
      </section>

      <nav class="view-tabs" aria-label="ページ切り替え">
        <button id="inputTab" class="tab-button active" type="button" aria-controls="inputPage">スコア入力</button>
        <button id="scheduleTab" class="tab-button" type="button" aria-controls="schedulePage">卓組</button>
        <button id="rankingTab" class="tab-button" type="button" aria-controls="rankingPage">ランキング</button>
      </nav>

      <section id="inputPage" class="page-view active">
        <section class="panel players-panel" aria-labelledby="playersHeading">
          <div class="section-title">
            <h2 id="playersHeading">選手</h2>
            <span id="playerCount" class="count-label">0人</span>
          </div>
          <div id="playerList" class="chip-list" aria-live="polite"></div>
        </section>

        <section id="scoreEntryPanel" class="panel result-entry" aria-labelledby="entryHeading">
          <div class="section-title">
            <div>
              <h2 id="entryHeading">スコア入力</h2>
              <p id="editNotice" class="edit-notice" hidden>対局履歴を修正中です。</p>
            </div>
            <span id="saveStatus" class="status-pill"></span>
          </div>
          <form id="matchForm" class="match-form">
            <div class="match-meta">
              <label>
                卓
                <select id="tableName" required></select>
              </label>
              <label>
                回戦
                <select id="roundNumber" required></select>
              </label>
            </div>
            <div id="seatRows" class="seat-rows"></div>
            <div id="scoreTotal" class="score-total" aria-live="polite">
              <span>合計</span>
              <strong>0点</strong>
              <small>100,000点にしてください</small>
            </div>
            <div class="form-actions">
              <button id="submitMatchButton" class="primary-button" type="submit">スコアを登録</button>
              <button id="cancelEditButton" class="ghost-button" type="button" hidden>修正をやめる</button>
            </div>
          </form>
        </section>

        <section class="panel history-panel" aria-labelledby="historyHeading">
          <div class="section-title">
            <h2 id="historyHeading">対局履歴</h2>
            <span id="matchCount" class="count-label">0対局</span>
          </div>
          <div id="matchHistory" class="history-list"></div>
        </section>
      </section>

      <section id="schedulePage" class="page-view">
        <section class="panel schedule-panel" aria-labelledby="scheduleHeading">
          <div class="section-title">
            <h2 id="scheduleHeading">卓組</h2>
            <span id="scheduleRoundLabel" class="count-label">1回戦</span>
          </div>
          <div id="scheduleRoundTabs" class="schedule-round-tabs" aria-label="回戦切り替え"></div>
          <div class="schedule-list-heading" aria-hidden="true">
            <span>卓</span>
            <span>参加者</span>
          </div>
          <div id="scheduleList" class="schedule-list"></div>
        </section>
      </section>

      <section id="rankingPage" class="page-view">
        <section class="panel standings-panel" aria-labelledby="standingsHeading">
          <div class="section-title">
            <h2 id="standingsHeading">成績ランキング</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>順位</th>
                  <th>選手</th>
                  <th>対局数</th>
                  <th>合計</th>
                  <th>平均</th>
                  <th>平均順位</th>
                  <th>1着</th>
                  <th>2着</th>
                  <th>3着</th>
                  <th>4着</th>
                  <th>素点平均</th>
                </tr>
              </thead>
              <tbody id="standingsBody"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <dialog id="playerDetailDialog" class="detail-dialog">
      <div class="detail-dialog-header">
        <h2 id="detailPlayerName">個人成績</h2>
        <button id="closeDetailButton" class="icon-button" type="button" aria-label="閉じる">×</button>
      </div>
      <div id="detailStats" class="detail-stats"></div>
    </dialog>

    <template id="seatTemplate">
      <div class="seat-row">
        <select class="seat-player" required></select>
        <input class="seat-score" type="number" step="100" placeholder="素点" required />
        <span class="seat-preview">0.0 pt</span>
      </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./event_schedule.js?v=20260929-sanpin"></script>
    <script src="./app.js?v=20260929-schedule-view" defer></script>
  </body>
</html>
